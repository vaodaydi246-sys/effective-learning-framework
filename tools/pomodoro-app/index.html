<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effective Learning - Advanced Pomodoro - Custom Background</title>
    <style>
        /* Thiết lập các chủ đề nền (Theme) dạng biến CSS */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            transition: background 0.8s ease;
            position: relative;
            overflow: hidden;
        }

        /* Các class tương ứng với từng loại nền */
        body.theme-rainbow {
            background: linear-gradient(-45deg, #ff416c, #ff4b2b, #11998e, #38ef7d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        body.theme-cyberpunk {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 40%, #631257 100%);
        }
        body.theme-sunset {
            background: linear-gradient(135deg, #f12711, #f5af19);
        }
        body.theme-frost {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
        }
        body.theme-minimal {
            background: #eef2f3;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- MENU CHỌN NỀN (Nằm góc trên cùng) --- */
        .bg-selector-container {
            position: absolute;
            top: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
        }
        .bg-selector-container span {
            font-size: 12px;
            font-weight: bold;
            color: #444;
        }
        .bg-select {
            background: white;
            border: 1px solid #ddd;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            outline: none;
        }

        /* Thẻ chứa Pomodoro (Glassmorphism) */
        .timer-card { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), 0 0 30px rgba(255,255,255,0.5) inset; 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            border: 2px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
        }

        h1 { 
            background: linear-gradient(45deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px; 
            margin-bottom: 5px; 
            font-weight: 800;
        }

        .status-text { 
            color: #ff6b6b; 
            font-size: 14px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold;
        }
        
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        
        .mode-btn { 
            background-color: #f0f0f0; 
            border: 2px solid transparent; 
            padding: 12px 10px; 
            font-size: 13px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #666; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            flex: 1; 
        }
        
        .mode-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Màu riêng của từng nút khi Active */
        .mode-btn.active#btn-pomodoro { 
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(255, 8, 68, 0.4);
        } 
        
        .mode-btn.active#btn-short { 
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .mode-btn.active#btn-long { 
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(245, 175, 25, 0.4);
        }
        
        .time { 
            font-size: 80px; 
            font-weight: 900; 
            color: #ff0844; 
            margin: 15px 0 30px 0; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 2px 4px 10px rgba(0,0,0,0.15);
            transition: color 0.4s ease;
        }
        
        .btn-main { 
            background: linear-gradient(45deg, #11998e, #38ef7d); 
            color: white; 
            border: none; 
            padding: 18px 30px; 
            font-size: 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        
        .btn-main:hover { 
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.6);
        }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<!-- Mặc định ban đầu dùng nền Cầu vồng rực rỡ -->
<body class="theme-rainbow">

    <!-- Thanh Menu chọn hình nền -->
    <div class="bg-selector-container">
        <span>🖼️ Đổi nền:</span>
        <select class="bg-select" id="bgSelect" onchange="changeBackground()">
            <option value="theme-rainbow">🌈 Cầu vồng động</option>
            <option value="theme-cyberpunk">🔮 Neon Tím Đêm</option>
            <option value="theme-sunset">🌅 Cam Hoàng Hôn</option>
            <option value="theme-frost">❄️ Xanh Băng Giá</option>
            <option value="theme-minimal">⚪ Tối giản (Xám)</option>
        </select>
    </div>

    <div class="timer-card">
        <h1>🎯 ELF Pomodoro</h1>
        <div class="status-text" id="status">SẴN SÀNG HỌC TẬP</div>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-pomodoro" onclick="setMode('pomodoro', 25, 'Sẵn sàng học tập')">25m Học</button>
            <button class="mode-btn" id="btn-short" onclick="setMode('short', 5, 'Nghỉ giải lao ngắn')">5m Nghỉ</button>
            <button class="mode-btn" id="btn-long" onclick="setMode('long', 15, 'Nghỉ ngơi dài')">15m Nghỉ</button>
        </div>

        <div class="time" id="timer">25:00</div>
        <button class="btn-main" id="startBtn" onclick="toggleTimer()">BẮT ĐẦU</button>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        // Hàm xử lý đổi hình nền khi người dùng chọn menu
        function changeBackground() {
            const select = document.getElementById('bgSelect');
            const selectedTheme = select.value;
            
            // Xóa hết các class nền cũ và gán class mới cho thẻ body
            document.body.className = ''; 
            document.body.classList.add(selectedTheme);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setMode(mode, minutes, statusText) {
            clearInterval(timerId);
            timerId = null;
            
            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = "BẮT ĐẦU";
            startBtn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
            startBtn.style.boxShadow = "0 6px 20px rgba(56, 239, 125, 0.4)";

            timeLeft = minutes * 60;
            document.getElementById('status').textContent = statusText;
            updateTimerDisplay();

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            let activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.add('active');
            
            const timerDisplay = document.getElementById('timer');
            if (mode === 'pomodoro') {
                timerDisplay.style.color = '#ff0844'; 
            } else if (mode === 'short') {
                timerDisplay.style.color = '#0072ff'; 
            } else {
                timerDisplay.style.color = '#f12711'; 
            }
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            if (timerId === null) {
                startBtn.textContent = "TẠM DỪNG";
                startBtn.style.background = "linear-gradient(45deg, #f12711, #f5af19)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(245, 175, 25, 0.4)";
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        updateTimerDisplay(); 
                    } else { 
                        clearInterval(timerId); 
                        timerId = null;
                        startBtn.textContent = "BẮT ĐẦU";
                        startBtn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
                        startBtn.style.boxShadow = "0 6px 20px rgba(56, 239, 125, 0.4)";
                        alert("⏳ Đã hết thời gian! Chuyển sang bước tiếp theo nào."); 
                    }
                }, 1000);
            } else {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = "TIẾP TỤC";
                startBtn.style.background = "linear-gradient(45deg, #8a2387, #e94057, #f27121)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(233, 64, 87, 0.4)";
            }
        }
    </script>
</body>
</html>

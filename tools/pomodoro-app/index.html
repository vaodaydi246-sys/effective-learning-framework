<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocus Style Pomodoro</title>
    <style>
        /* --- ĐỊNH DẠNG CHUNG (CHUẨN FLOCUS) --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Hình nền mặc định tối mờ lãng mạn */
            background: #1e1e1e url('https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920') no-repeat center center/cover;
            color: white;
            overflow: hidden;
            transition: background-image 0.5s ease;
        }

        /* Lớp phủ mờ đè lên ảnh nền giúp nhìn rõ chữ */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        /* --- BỘ ĐẾM GIỜ TRUNG TÂM --- */
        .main-timer-container {
            position: relative;
            z-index: 2;
            text-align: center;
            /* Hoàn toàn loại bỏ khung viền trắng, chỉ có chữ nổi trên nền ảnh */
        }

        /* Nút chuyển chế độ dạng chữ trần */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 10px;
        }
        .mode-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 5px 0;
            transition: all 0.3s ease;
            position: relative;
        }
        .mode-btn:hover, .mode-btn.active {
            color: #fff;
        }
        /* Gạch chân nhỏ dưới nút đang chọn */
        .mode-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 2px;
            background: white;
            border-radius: 2px;
        }

        /* Con số thời gian khổng lồ đặc trưng */
        .time-display {
            font-size: 120px;
            font-weight: 700;
            line-height: 1;
            margin: 15px 0 30px 0;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        /* Nút START/PAUSE tối giản */
        .action-btn {
            background: white;
            color: black;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .action-btn:hover {
            transform: scale(1.05);
            background: #f0f0f0;
        }

        /* --- NÚT BÁNH RĂNG CÀI ĐẶT GÓC PHẢI --- */
        .settings-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }
        .settings-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* --- SIDEBAR CÀI ĐẶT TRƯỢT TỪ CẠNH PHẢI VÀO --- */
        .sidebar-settings {
            position: fixed;
            top: 0;
            right: -350px; /* Ban đầu giấu ngoài màn hình */
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            z-index: 100;
            padding: 30px;
            box-sizing: border-box;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        /* Lớp kích hoạt trượt thanh sidebar ra */
        .sidebar-settings.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .sidebar-header h3 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
        .close-sidebar-btn {
            background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer;
        }
        .close-sidebar-btn:hover { color: white; }

        /* Các mục cấu hình bên trong thanh cài đặt */
        .setting-group {
            margin-bottom: 25px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .setting-group input[type="number"], .setting-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        .setting-group input:focus, .setting-group select:focus {
            outline: none;
            border-color: rgba(255,255,255,0.4);
        }

        .save-sidebar-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        .save-sidebar-btn:hover {
            background: white;
            color: black;
        }

        /* Ẩn giao diện khi đang chạy để cực kỳ tập trung giống Flocus */
        .main-timer-container.focus-mode .mode-switcher,
        .main-timer-container.focus-mode .action-btn {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        /* Khi di chuột vào vùng giữa thì hiện lại nút bấm để Pause */
        .main-timer-container.focus-mode:hover .mode-switcher,
        .main-timer-container.focus-mode:hover .action-btn {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- NÚT BÁNH RĂNG MỞ CÀI ĐẶT (GÓC TRÊN PHẢI) -->
    <button class="settings-toggle-btn" id="openSettingsBtn">⚙️</button>

    <!-- THANH CÀI ĐẶT CẠNH BÊN (SIDEBAR) -->
    <div class="sidebar-settings" id="sidebarSettings">
        <div class="sidebar-header">
            <h3>Cài đặt</h3>
            <button class="close-sidebar-btn" id="closeSettingsBtn">&times;</button>
        </div>

        <!-- Chỉnh thời gian -->
        <div class="setting-group">
            <label>Thời gian học (Phút)</label>
            <input type="number" id="input-pomo" value="25" min="1">
        </div>
        <div class="setting-group">
            <label>Nghỉ ngắn (Phút)</label>
            <input type="number" id="input-short" value="5" min="1">
        </div>
        <div class="setting-group">
            <label>Nghỉ dài (Phút)</label>
            <input type="number" id="input-long" value="15" min="1">
        </div>

        <!-- Đổi hình nền -->
        <div class="setting-group">
            <label>Hình nền không gian</label>
            <select id="select-bg">
                <option value="https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920">🏔️ Thụy Sĩ yên bình</option>
                <option value="https://images.unsplash.com/photo-1431274151480-1a111107ec45?q=80&w=1920">🗼 Paris mộng mơ</option>
                <option value="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920">⛩️ Kyoto cổ kính</option>
                <option value="https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?q=80&w=1920">🪵 Phòng làm việc gỗ ấm</option>
            </select>
        </div>

        <button class="save-sidebar-btn" onclick="saveSettings()">ÁP DỤNG CÀI ĐẶT</button>
    </div>

    <!-- GIAO DIỆN HÌNH ĐẾM GIỜ CHÍNH GIỮA MÀN HÌNH -->
    <div class="main-timer-container" id="timerContainer">
        <!-- 3 nút tab trần -->
        <div class="mode-switcher">
            <button class="mode-btn active" id="btn-pomo" onclick="changeMode('pomo')">Pomodoro</button>
            <button class="mode-btn" id="btn-short" onclick="changeMode('short')">Short Break</button>
            <button class="mode-btn" id="btn-long" onclick="changeMode('long')">Long Break</button>
        </div>

        <!-- Số đếm cực đại -->
        <div class="time-display" id="timeDisplay">25:00</div>

        <!-- Nút hành động -->
        <button class="action-btn" id="actionBtn" onclick="toggleTimer()">START</button>
    </div>

    <script>
        // Dữ liệu thời gian mặc định
        let configTimes = { pomo: 25, short: 5, long: 15 };
        let activeMode = 'pomo';
        let timeLeft = configTimes.pomo * 60;
        let countdownInterval = null;
        let timerRunning = false;

        // Dom các phần tử Sidebar
        const sidebar = document.getElementById('sidebarSettings');
        const openBtn = document.getElementById('openSettingsBtn');
        const closeBtn = document.getElementById('closeSettingsBtn');
        const timerContainer = document.getElementById('timerContainer');

        // Sự kiện Đóng/Mở Sidebar bằng hiệu ứng trượt
        openBtn.addEventListener('click', () => sidebar.classList.add('open'));
        closeBtn.addEventListener('click', () => sidebar.classList.remove('open'));

        // Đổi hình nền trực tiếp khi chọn trong danh sách
        document.getElementById('select-bg').addEventListener('change', function() {
            document.body.style.backgroundImage = `url('${this.value}')`;
        });

        // Áp dụng số phút mới từ Sidebar cấu hình
        function saveSettings() {
            configTimes.pomo = parseInt(document.getElementById('input-pomo').value) || 25;
            configTimes.short = parseInt(document.getElementById('input-short').value) || 5;
            configTimes.long = parseInt(document.getElementById('input-long').value) || 15;
            
            sidebar.classList.remove('open'); // Đóng cài đặt lại sau khi lưu
            resetCurrentTimer();
        }

        // Chuyển chế độ đếm giờ (Pomodoro / Nghỉ ngắn / Nghỉ dài)
        function changeMode(mode) {
            if (timerRunning) return; // Đang chạy thì không cho bấm đổi chế độ bừa bãi
            
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            resetCurrentTimer();
        }

        // Đặt lại đồng hồ về ban đầu
        function resetCurrentTimer() {
            clearInterval(countdownInterval);
            countdownInterval = null;
            timerRunning = false;
            timeLeft = configTimes[activeMode] * 60;
            updateDisplay();
            
            document.getElementById('actionBtn').textContent = 'START';
            timerContainer.classList.remove('focus-mode'); // Hiện lại các thành phần phụ
            openBtn.style.display = 'flex'; // Hiện lại nút cài đặt bánh răng
        }

        // Cập nhật text hiển thị thời gian lên màn hình
        function updateDisplay() {
            let minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${minutes}:${seconds}`;
        }

        // Bật/Tạm dừng đếm giờ chính
        function toggleTimer() {
            const actionBtn = document.getElementById('actionBtn');

            if (!timerRunning) {
                // KHI BẤM CHẠY
                timerRunning = true;
                actionBtn.textContent = 'PAUSE';
                
                // Giấu nút cài đặt bánh răng đi để tập trung tối đa
                openBtn.style.display = 'none';
                sidebar.classList.remove('open');
                
                // Kích hoạt chế độ focus (Ẩn mờ các nút tab và nút bấm khi không di chuột)
                timerContainer.classList.add('focus-mode');

                countdownInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        alert("Hoàn thành phiên làm việc!");
                        resetCurrentTimer();
                    }
                }, 1000);
            } else {
                // KHI BẤM TẠM DỪNG
                resetCurrentTimer();
            }
        }
    </script>
</body>
</html>

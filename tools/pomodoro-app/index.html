<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effective Learning - Advanced Pomodoro - Aesthetic Scenery</title>
    <style>
        /* Thiết lập nền mặc định ban đầu */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background 1s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        /* --- MENU CHỌN NỀN PHONG CẢNH --- */
        .bg-selector-container {
            position: absolute;
            top: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .bg-selector-container span {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
        }
        .bg-select {
            background: #f8f9fa;
            border: 1px solid #ced4da;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }
        .bg-select:hover {
            background: #e9ecef;
        }

        /* Thẻ chứa Pomodoro dạng Kính cường lực cao cấp */
        .timer-card { 
            background: rgba(255, 255, 255, 0.85); 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3), 0 0 30px rgba(255,255,255,0.5) inset; 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            border: 2px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        .timer-card:hover {
            transform: translateY(-5px);
        }

        h1 { 
            background: linear-gradient(45deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px; 
            margin-bottom: 5px; 
            font-weight: 800;
        }

        .status-text { 
            color: #e74c3c; 
            font-size: 13px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold;
        }
        
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        
        .mode-btn { 
            background-color: rgba(0,0,0,0.05); 
            border: none; 
            padding: 12px 10px; 
            font-size: 13px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #555; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            flex: 1; 
        }
        
        .mode-btn:hover { 
            transform: translateY(-3px);
            background-color: rgba(0,0,0,0.1);
        }

        /* Màu rực rỡ khi nút Active */
        .mode-btn.active#btn-pomodoro { 
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(255, 8, 68, 0.4);
        } 
        
        .mode-btn.active#btn-short { 
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .mode-btn.active#btn-long { 
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(245, 175, 25, 0.4);
        }
        
        .time { 
            font-size: 84px; 
            font-weight: 900; 
            color: #ff0844; 
            margin: 10px 0 25px 0; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 2px 4px 10px rgba(0,0,0,0.15);
            transition: color 0.4s ease;
        }
        
        .btn-main { 
            background: linear-gradient(45deg, #11998e, #38ef7d); 
            color: white; 
            border: none; 
            padding: 18px 30px; 
            font-size: 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        
        .btn-main:hover { 
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.6);
        }
    </style>
</head>
<body>

    <!-- Menu chọn hình nền phong cảnh nghệ thuật -->
    <div class="bg-selector-container">
        <span>🏞️ Chọn phong cảnh:</span>
        <select class="bg-select" id="bgSelect" onchange="changeBackground()">
            <option value="cozy">📚 Phòng học ấm cúng (Lofi)</option>
            <option value="cyberpunk">🔮 Neon Đêm Mưa (Cyberpunk)</option>
            <option value="sunset">🌅 Thung lũng hoàng hôn (Aesthetic)</option>
            <option value="gradient">🌈 Cầu vồng Gradient động</option>
        </select>
    </div>

    <div class="timer-card">
        <h1>🎯 ELF Pomodoro</h1>
        <div class="status-text" id="status">SẴN SÀNG HỌC TẬP</div>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-pomodoro" onclick="setMode('pomodoro', 25, 'Sẵn sàng học tập')">25m Học</button>
            <button class="mode-btn" id="btn-short" onclick="setMode('short', 5, 'Nghỉ giải lao ngắn')">5m Nghỉ</button>
            <button class="mode-btn" id="btn-long" onclick="setMode('long', 15, 'Nghỉ ngơi dài')">15m Nghỉ</button>
        </div>

        <div class="time" id="timer">25:00</div>
        <button class="btn-main" id="startBtn" onclick="toggleTimer()">BẮT ĐẦU</button>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        // Lưu trữ danh sách URL ảnh phong cảnh chất lượng cao từ thư viện hình ảnh công cộng
        const backgrounds = {
            cozy: "url('https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcRK9zo7EamshLlPZtXGikt5CSN-EcD6OJHwh8qPexN3PNHudKejLfg3KxNIfpK5jiVETYaA5A1zyD0zvX0')",
            cyberpunk: "url('https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcTHn0NgSRjkjKdvclWXLCrL0Uz_aLQlC691lMM9Wqs9bTty65SPhdOVJWP2Iab_KZ-tXCGWY-vMYOR_gJo')",
            sunset: "url('https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcTBJZlLQ-q1AhByVCPnBBl2A5vb1TUTGIVK7J9F6P5yLIXEKDA4A_cS8Dod-YFeSyEhMk__aZ7kdVSpaJw')",
            gradient: "linear-gradient(-45deg, #ff416c, #ff4b2b, #11998e, #38ef7d)"
        };

        // Hàm thay đổi hình nền
        function changeBackground() {
            const selectedKey = document.getElementById('bgSelect').value;
            const body = document.body;
            
            // Xóa hiệu ứng animation cũ nếu có
            body.style.animation = 'none';
            body.style.backgroundSize = 'cover';

            if (selectedKey === 'gradient') {
                body.style.background = backgrounds[selectedKey];
                body.style.backgroundSize = '400% 400%';
                // Tự viết hàm kích hoạt lại keyframes mượt mà
                setTimeout(() => {
                    body.style.animation = 'gradientAnimation 15s ease infinite';
                }, 10);
            } else {
                body.style.backgroundImage = backgrounds[selectedKey];
            }
        }

        // Thêm một style block động cho animation gradient khi cần thiết
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes gradientAnimation {
                0% { background-position: 0% 50%; }
                50% { background-position: 100% 50%; }
                100% { background-position: 0% 50%; }
            }
        `;
        document.head.appendChild(styleSheet);

        // Thiết lập hình nền mặc định ban đầu ngay khi tải trang
        window.onload = function() {
            changeBackground();
        };

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setMode(mode, minutes, statusText) {
            clearInterval(timerId);
            timerId = null;
            
            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = "BẮT ĐẦU";
            startBtn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
            startBtn.style.boxShadow = "0 6px 20px rgba(56, 239, 125, 0.4)";

            timeLeft = minutes * 60;
            document.getElementById('status').textContent = statusText;
            updateTimerDisplay();

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            let activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.add('active');
            
            const timerDisplay = document.getElementById('timer');
            if (mode === 'pomodoro') {
                timerDisplay.style.color = '#ff0844'; 
            } else if (mode === 'short') {
                timerDisplay.style.color = '#0072ff'; 
            } else {
                timerDisplay.style.color = '#f12711'; 
            }
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            if (timerId === null) {
                startBtn.textContent = "TẠM DỪNG";
                startBtn.style.background = "linear-gradient(45deg, #f12711, #f5af19)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(245, 175, 25, 0.4)";
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        updateTimerDisplay(); 
                    } else { 
                        clearInterval(timerId); 
                        timerId = null;
                        startBtn.textContent = "BẮT ĐẦU";
                        startBtn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
                        startBtn.style.boxShadow = "0 6px 20px rgba(56, 239, 125, 0.4)";
                        alert("⏳ Đã hết thời gian! Chuyển sang bước tiếp theo nào."); 
                    }
                }, 1000);
            } else {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = "TIẾP TỤC";
                startBtn.style.background = "linear-gradient(45deg, #8a2387, #e94057, #f27121)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(233, 64, 87, 0.4)";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocus Style Pomodoro - Pro</title>
    <style>
        /* --- ĐỊNH DẠNG CHUNG --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1e1e1e url('https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920') no-repeat center center/cover;
            color: white;
            overflow: hidden;
            transition: background-image 0.5s ease;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1;
        }

        /* --- BỘ ĐẾM GIỜ TRUNG TÂM --- */
        .main-timer-container {
            position: relative;
            z-index: 2;
            text-align: center;
            height: 250px; /* Cố định chiều cao để chống giật bố cục */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Thanh Tabs chuyển chế độ */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 10px;
            height: 30px;
        }
        .mode-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 5px 0;
            transition: all 0.3s ease;
            position: relative;
        }
        .mode-btn:hover, .mode-btn.active {
            color: #fff;
        }
        .mode-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 2px;
            background: white;
            border-radius: 2px;
        }

        /* Dòng chữ trạng thái (Chỉ hiện khi đang đếm giờ) */
        .status-label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            height: 30px;
            display: none; /* Ẩn mặc định */
            align-items: center;
        }

        /* Số đếm giờ */
        .time-display {
            font-size: 130px;
            font-weight: 700;
            line-height: 1;
            margin: 10px 0 30px 0;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        /* Nút START/PAUSE */
        .action-btn {
            background: white;
            color: black;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s ease, opacity 0.5s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .action-btn:hover {
            transform: scale(1.05);
        }

        /* --- ẨN ĐI KHI TẬP TRUNG --- */
        /* Chỉ làm mờ nút Tạm dừng, khi di chuột vào sẽ hiện lên */
        .main-timer-container.focus-mode .action-btn {
            opacity: 0;
            pointer-events: none;
        }
        .main-timer-container.focus-mode:hover .action-btn {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- NÚT BÁNH RĂNG VÀ SIDEBAR --- */
        .settings-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease;
        }
        .settings-toggle-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .sidebar-settings {
            position: fixed;
            top: 0;
            right: -350px;
            width: 320px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
            z-index: 100;
            padding: 30px;
            box-sizing: border-box;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        .sidebar-settings.open { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .sidebar-header h3 { margin: 0; font-size: 20px; }
        .close-sidebar-btn { background: none; border: none; color: #aaa; font-size: 28px; cursor: pointer; }
        .close-sidebar-btn:hover { color: white; }

        .setting-group { margin-bottom: 20px; }
        .setting-group label {
            display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
        }
        .setting-group input[type="number"], .setting-group select {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;
        }
        .setting-group input:focus, .setting-group select:focus { outline: none; border-color: rgba(255,255,255,0.4); }

        .save-sidebar-btn {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
            color: white; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background 0.3s;
        }
        .save-sidebar-btn:hover { background: white; color: black; }
        
        /* Chỉnh style cho Option dropdown đen */
        option { background: #333; color: white; }
    </style>
</head>
<body>

    <!-- NÚT MỞ CÀI ĐẶT -->
    <button class="settings-toggle-btn" id="openSettingsBtn">⚙️</button>

    <!-- SIDEBAR CÀI ĐẶT -->
    <div class="sidebar-settings" id="sidebarSettings">
        <div class="sidebar-header">
            <h3 id="txt-title">Cài đặt</h3>
            <button class="close-sidebar-btn" id="closeSettingsBtn">&times;</button>
        </div>

        <div class="setting-group">
            <label id="txt-lang-label">Ngôn ngữ / Language</label>
            <select id="select-lang" onchange="changeLanguage()">
                <option value="vi">Tiếng Việt</option>
                <option value="en">English</option>
            </select>
        </div>

        <div class="setting-group">
            <label id="txt-pomo-label">Thời gian học (Phút)</label>
            <input type="number" id="input-pomo" value="25" min="1">
        </div>
        <div class="setting-group">
            <label id="txt-short-label">Nghỉ ngắn (Phút)</label>
            <input type="number" id="input-short" value="5" min="1">
        </div>
        <div class="setting-group">
            <label id="txt-long-label">Nghỉ dài (Phút)</label>
            <input type="number" id="input-long" value="15" min="1">
        </div>

        <div class="setting-group">
            <label id="txt-bg-label">Hình nền không gian</label>
            <select id="select-bg">
                <option value="https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920" id="bg-1">🏔️ Thụy Sĩ yên bình</option>
                <option value="https://images.unsplash.com/photo-1431274151480-1a111107ec45?q=80&w=1920" id="bg-2">🗼 Paris mộng mơ</option>
                <option value="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920" id="bg-3">⛩️ Kyoto cổ kính</option>
                <option value="https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?q=80&w=1920" id="bg-4">🪵 Phòng làm việc</option>
            </select>
        </div>

        <button class="save-sidebar-btn" id="btn-save" onclick="saveSettings()">ÁP DỤNG CÀI ĐẶT</button>
    </div>

    <!-- KHUNG ĐẾM GIỜ -->
    <div class="main-timer-container" id="timerContainer">
        
        <!-- Tab chuyển chế độ (Chỉ hiện khi ĐANG DỪNG) -->
        <div class="mode-switcher" id="modeSwitcher">
            <button class="mode-btn active" id="btn-pomo" onclick="changeMode('pomo')">Pomodoro</button>
            <button class="mode-btn" id="btn-short" onclick="changeMode('short')">Nghỉ ngắn</button>
            <button class="mode-btn" id="btn-long" onclick="changeMode('long')">Nghỉ dài</button>
        </div>

        <!-- Nhãn trạng thái (Chỉ hiện khi ĐANG CHẠY) -->
        <div class="status-label" id="statusLabel">ĐANG TẬP TRUNG</div>

        <!-- Số thời gian -->
        <div class="time-display" id="timeDisplay">25:00</div>

        <!-- Nút bấm -->
        <button class="action-btn" id="actionBtn" onclick="toggleTimer()">BẮT ĐẦU</button>
    </div>

    <script>
        // QUẢN LÝ NGÔN NGỮ
        const langData = {
            vi: {
                title: "Cài đặt",
                langLabel: "Ngôn ngữ",
                pomoLabel: "Thời gian học (Phút)",
                shortLabel: "Nghỉ ngắn (Phút)",
                longLabel: "Nghỉ dài (Phút)",
                bgLabel: "Hình nền không gian",
                save: "ÁP DỤNG CÀI ĐẶT",
                bg1: "🏔️ Thụy Sĩ yên bình", bg2: "🗼 Paris mộng mơ", bg3: "⛩️ Kyoto cổ kính", bg4: "🪵 Phòng làm việc",
                btnPomo: "Pomodoro", btnShort: "Nghỉ ngắn", btnLong: "Nghỉ dài",
                start: "BẮT ĐẦU", pause: "TẠM DỪNG",
                statPomo: "ĐANG TẬP TRUNG", statShort: "ĐANG NGHỈ NGẮN", statLong: "ĐANG NGHỈ DÀI"
            },
            en: {
                title: "Settings",
                langLabel: "Language",
                pomoLabel: "Focus Time (Min)",
                shortLabel: "Short Break (Min)",
                longLabel: "Long Break (Min)",
                bgLabel: "Background",
                save: "APPLY SETTINGS",
                bg1: "🏔️ Swiss Alps", bg2: "🗼 Paris Dreams", bg3: "⛩️ Classic Kyoto", bg4: "🪵 Cozy Workspace",
                btnPomo: "Pomodoro", btnShort: "Short Break", btnLong: "Long Break",
                start: "START", pause: "PAUSE",
                statPomo: "FOCUSING", statShort: "SHORT BREAK", statLong: "LONG BREAK"
            }
        };

        let currentLang = 'vi';
        
        function changeLanguage() {
            currentLang = document.getElementById('select-lang').value;
            const data = langData[currentLang];

            // Cập nhật Sidebar
            document.getElementById('txt-title').textContent = data.title;
            document.getElementById('txt-lang-label').textContent = data.langLabel;
            document.getElementById('txt-pomo-label').textContent = data.pomoLabel;
            document.getElementById('txt-short-label').textContent = data.shortLabel;
            document.getElementById('txt-long-label').textContent = data.longLabel;
            document.getElementById('txt-bg-label').textContent = data.bgLabel;
            document.getElementById('btn-save').textContent = data.save;
            
            document.getElementById('bg-1').textContent = data.bg1;
            document.getElementById('bg-2').textContent = data.bg2;
            document.getElementById('bg-3').textContent = data.bg3;
            document.getElementById('bg-4').textContent = data.bg4;

            // Cập nhật màn hình chính
            document.getElementById('btn-pomo').textContent = data.btnPomo;
            document.getElementById('btn-short').textContent = data.btnShort;
            document.getElementById('btn-long').textContent = data.btnLong;
            
            // Cập nhật nút bấm và trạng thái
            if(!timerRunning) {
                document.getElementById('actionBtn').textContent = data.start;
            } else {
                document.getElementById('actionBtn').textContent = data.pause;
                updateStatusLabel();
            }
        }

        // QUẢN LÝ THỜI GIAN
        let configTimes = { pomo: 25, short: 5, long: 15 };
        let activeMode = 'pomo';
        let timeLeft = configTimes.pomo * 60;
        let countdownInterval = null;
        let timerRunning = false;

        // Xử lý Sidebar
        const sidebar = document.getElementById('sidebarSettings');
        document.getElementById('openSettingsBtn').addEventListener('click', () => sidebar.classList.add('open'));
        document.getElementById('closeSettingsBtn').addEventListener('click', () => sidebar.classList.remove('open'));

        document.getElementById('select-bg').addEventListener('change', function() {
            document.body.style.backgroundImage = `url('${this.value}')`;
        });

        function saveSettings() {
            configTimes.pomo = parseInt(document.getElementById('input-pomo').value) || 25;
            configTimes.short = parseInt(document.getElementById('input-short').value) || 5;
            configTimes.long = parseInt(document.getElementById('input-long').value) || 15;
            sidebar.classList.remove('open'); 
            resetCurrentTimer();
        }

        function changeMode(mode) {
            if (timerRunning) return; 
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            resetCurrentTimer();
        }

        function resetCurrentTimer() {
            clearInterval(countdownInterval);
            countdownInterval = null;
            timerRunning = false;
            timeLeft = configTimes[activeMode] * 60;
            updateDisplay();
            
            document.getElementById('actionBtn').textContent = langData[currentLang].start;
            document.getElementById('timerContainer').classList.remove('focus-mode');
            
            // Hiển thị lại Tabs, ẩn nhãn trạng thái
            document.getElementById('modeSwitcher').style.display = 'flex';
            document.getElementById('statusLabel').style.display = 'none';
            document.getElementById('openSettingsBtn').style.display = 'flex';
        }

        function updateDisplay() {
            let minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${minutes}:${seconds}`;
        }

        function updateStatusLabel() {
            const data = langData[currentLang];
            const statusLabel = document.getElementById('statusLabel');
            if (activeMode === 'pomo') statusLabel.textContent = data.statPomo;
            if (activeMode === 'short') statusLabel.textContent = data.statShort;
            if (activeMode === 'long') statusLabel.textContent = data.statLong;
        }

        function toggleTimer() {
            const actionBtn = document.getElementById('actionBtn');
            const modeSwitcher = document.getElementById('modeSwitcher');
            const statusLabel = document.getElementById('statusLabel');

            if (!timerRunning) {
                // BẮT ĐẦU CHẠY
                timerRunning = true;
                actionBtn.textContent = langData[currentLang].pause;
                
                document.getElementById('openSettingsBtn').style.display = 'none';
                sidebar.classList.remove('open');
                document.getElementById('timerContainer').classList.add('focus-mode');
                
                // Đổi Tab thành Dòng trạng thái (vd: SHORT BREAK)
                modeSwitcher.style.display = 'none';
                statusLabel.style.display = 'flex';
                updateStatusLabel();

                countdownInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        alert("Hoàn thành!");
                        resetCurrentTimer();
                    }
                }, 1000);
            } else {
                // BẤM TẠM DỪNG
                resetCurrentTimer();
            }
        }
    </script>
</body>
</html>

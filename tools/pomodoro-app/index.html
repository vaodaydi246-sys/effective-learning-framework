<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Pomodoro - Global & Anime Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        /* Lớp phủ mờ giúp hình nền dịu lại */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* --- THANH MENU ĐIỀU KHIỂN TOP --- */
        .top-controls {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 18px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .control-group span {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
        }

        .custom-select {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }

        .custom-select:hover {
            background: #f1f3f5;
            border-color: #ced4da;
        }

        /* --- THẺ CHỨA POMODORO --- */
        .timer-card { 
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.75); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 24px 64px rgba(0,0,0,0.3), 0 0 40px rgba(255,255,255,0.4) inset; 
            text-align: center; 
            max-width: 380px; 
            width: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .timer-card:hover { transform: translateY(-4px); }

        h1 { 
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px; 
            margin-top: 0;
            margin-bottom: 5px; 
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .status-text { 
            color: #e74c3c; 
            font-size: 12px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold;
        }
        
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 8px; }
        
        .mode-btn { 
            background-color: rgba(0,0,0,0.06); 
            border: none; 
            padding: 12px 5px; 
            font-size: 12px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #4a4a4a; 
            transition: all 0.3s ease; 
            flex: 1; 
        }
        
        .mode-btn:hover { 
            transform: translateY(-2px);
            background-color: rgba(0,0,0,0.1);
        }

        .mode-btn.active#btn-pomodoro { 
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); 
            color: white; box-shadow: 0 6px 14px rgba(255, 65, 108, 0.35);
        } 
        
        .mode-btn.active#btn-short { 
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); 
            color: white; box-shadow: 0 6px 14px rgba(0, 114, 255, 0.35);
        }

        .mode-btn.active#btn-long { 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            color: white; box-shadow: 0 6px 14px rgba(56, 239, 125, 0.35);
        }
        
        .time { 
            font-size: 80px; 
            font-weight: 900; 
            color: #ff416c; 
            margin: 10px 0 25px 0; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 2px 4px 12px rgba(0,0,0,0.12);
            transition: color 0.4s ease;
        }
        
        .btn-main { 
            background: linear-gradient(45deg, #ff4e50, #f9d423); 
            color: white; border: none; padding: 16px 30px; font-size: 18px; 
            border-radius: 50px; cursor: pointer; transition: all 0.3s ease; 
            width: 100%; font-weight: bold; letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(255, 78, 80, 0.4);
        }
        
        .btn-main:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(255, 78, 80, 0.55); }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Khung Menu Điều Khiển -->
    <div class="top-controls">
        <!-- Chuyển đổi ngôn ngữ -->
        <div class="control-group">
            <span id="label-lang">🌐 Ngôn ngữ:</span>
            <select class="custom-select" id="langSelect" onchange="changeLanguage()">
                <option value="vi">Tiếng Việt</option>
                <option value="en">English</option>
            </select>
        </div>

        <!-- Chọn hình nền -->
        <div class="control-group">
            <span id="label-bg">🌍 Hình nền:</span>
            <select class="custom-select" id="bgSelect" onchange="changeBackground()">
                <option value="anime_room" id="opt-anime-room">📖 Phòng học Anime</option>
                <option value="anime_sakura" id="opt-anime-sakura">🌸 Anime Hoa Anh Đào</option>
                <option value="swiss_alps" id="opt-swiss">🏔️ Thung lũng Thụy Sĩ</option>
                <option value="paris_night" id="opt-paris">🗼 Paris Về Đêm</option>
                <option value="kyoto_shrine" id="opt-kyoto">⛩️ Đền thờ Kyoto (Nhật Bản)</option>
                <option value="halong_bay" id="opt-halong">⛵ Vịnh Hạ Long (Việt Nam)</option>
            </select>
        </div>
    </div>

    <!-- Thẻ Đếm Giờ -->
    <div class="timer-card">
        <h1 id="app-title">🎯 ELF Pomodoro</h1>
        <div class="status-text" id="status">SẴN SÀNG HỌC TẬP</div>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-pomodoro" onclick="setMode('pomodoro', 25)">25m Học</button>
            <button class="mode-btn" id="btn-short" onclick="setMode('short', 5)">5m Nghỉ</button>
            <button class="mode-btn" id="btn-long" onclick="setMode('long', 15)">15m Nghỉ</button>
        </div>

        <div class="time" id="timer">25:00</div>
        <button class="btn-main" id="startBtn" onclick="toggleTimer()">BẮT ĐẦU</button>
    </div>

    <script>
        // --- 1. DỮ LIỆU TỪ ĐIỂN ĐA NGÔN NGỮ ---
        const i18n = {
            vi: {
                labelLang: "🌐 Ngôn ngữ:",
                labelBg: "🌍 Hình nền:",
                appTitle: "🎯 ELF Pomodoro",
                statusPomodoro: "SẴN SÀNG HỌC TẬP",
                statusShort: "NGHỈ GIẢI LAO NGẮN",
                statusLong: "NGHỈ NGƠI DÀI",
                btnPomodoro: "25m Học",
                btnShort: "5m Nghỉ",
                btnLong: "15m Nghỉ",
                btnStart: "BẮT ĐẦU",
                btnPause: "TẠM DỪNG",
                btnResume: "TIẾP TỤC",
                alertDone: "⏳ Đã hết thời gian! Chuyển sang bước tiếp theo nào.",
                optAnimeRoom: "📖 Phòng học Anime",
                optAnimeSakura: "🌸 Anime Hoa Anh Đào",
                optSwiss: "🏔️ Thung lũng Thụy Sĩ",
                optParis: "🗼 Paris Về Đêm",
                optKyoto: "⛩️ Đền thờ Kyoto",
                optHalong: "⛵ Vịnh Hạ Long"
            },
            en: {
                labelLang: "🌐 Language:",
                labelBg: "🌍 Background:",
                appTitle: "🎯 Focus Timer",
                statusPomodoro: "READY TO FOCUS",
                statusShort: "SHORT BREAK",
                statusLong: "LONG BREAK",
                btnPomodoro: "25m Focus",
                btnShort: "5m Break",
                btnLong: "15m Break",
                btnStart: "START",
                btnPause: "PAUSE",
                btnResume: "RESUME",
                alertDone: "⏳ Time is up! Let's move to the next step.",
                optAnimeRoom: "📖 Anime Study Room",
                optAnimeSakura: "🌸 Anime Sakura",
                optSwiss: "🏔️ Swiss Alps",
                optParis: "🗼 Paris at Night",
                optKyoto: "⛩️ Kyoto Shrine",
                optHalong: "⛵ Halong Bay"
            }
        };

        // --- 2. BỘ SƯU TẬP HÌNH NỀN ---
        const backgrounds = {
            anime_room: "url('https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTOmmZhAjkxSAZLsJi1_y5P4jAIurrHRuJdnYQpJlIy6LFXh6u2qR0EN_HnRuOI6dwLW5N01bP1dPDa-q4')",
            anime_sakura: "url('https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcR-C8lw7rE4jYlRdajEfSgUtxFri2q5x-PN6TQAUQNWfGTVdra-GLoVE57FHigqcmnFyohHLekFuRrFg1Q')",
            swiss_alps: "url('https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920&auto=format&fit=crop')",
            paris_night: "url('https://images.unsplash.com/photo-1431274151480-1a111107ec45?q=80&w=1920&auto=format&fit=crop')",
            kyoto_shrine: "url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920&auto=format&fit=crop')",
            halong_bay: "url('https://images.unsplash.com/photo-1528127269322-539801943592?q=80&w=1920&auto=format&fit=crop')"
        };

        // --- 3. BIẾN TRẠNG THÁI ---
        let timeLeft = 25 * 60;
        let timerId = null;
        let currentMode = 'pomodoro'; 
        let timerState = 'idle'; // idle, running, paused
        let currentLang = 'vi';

        window.onload = function() {
            changeBackground();
            updateText();
        };

        function changeBackground() {
            const selectedKey = document.getElementById('bgSelect').value;
            document.body.style.backgroundImage = backgrounds[selectedKey];
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            updateText();
        }

        // Hàm cập nhật toàn bộ chữ cái trên giao diện theo ngôn ngữ
        function updateText() {
            const langData = i18n[currentLang];
            
            // Labels
            document.getElementById('label-lang').textContent = langData.labelLang;
            document.getElementById('label-bg').textContent = langData.labelBg;
            document.getElementById('app-title').textContent = langData.appTitle;

            // Options Background
            document.getElementById('opt-anime-room').textContent = langData.optAnimeRoom;
            document.getElementById('opt-anime-sakura').textContent = langData.optAnimeSakura;
            document.getElementById('opt-swiss').textContent = langData.optSwiss;
            document.getElementById('opt-paris').textContent = langData.optParis;
            document.getElementById('opt-kyoto').textContent = langData.optKyoto;
            document.getElementById('opt-halong').textContent = langData.optHalong;

            // Buttons Tab
            document.getElementById('btn-pomodoro').textContent = langData.btnPomodoro;
            document.getElementById('btn-short').textContent = langData.btnShort;
            document.getElementById('btn-long').textContent = langData.btnLong;

            // Status Text
            if (currentMode === 'pomodoro') document.getElementById('status').textContent = langData.statusPomodoro;
            if (currentMode === 'short') document.getElementById('status').textContent = langData.statusShort;
            if (currentMode === 'long') document.getElementById('status').textContent = langData.statusLong;

            // Main Action Button State
            const startBtn = document.getElementById('startBtn');
            if (timerState === 'idle') startBtn.textContent = langData.btnStart;
            else if (timerState === 'running') startBtn.textContent = langData.btnPause;
            else if (timerState === 'paused') startBtn.textContent = langData.btnResume;
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setMode(mode, minutes) {
            clearInterval(timerId);
            timerId = null;
            timerState = 'idle';
            currentMode = mode;
            
            const startBtn = document.getElementById('startBtn');
            startBtn.style.background = "linear-gradient(45deg, #ff4e50, #f9d423)";
            startBtn.style.boxShadow = "0 6px 20px rgba(255, 78, 80, 0.4)";

            timeLeft = minutes * 60;
            updateText(); // Tự động cập nhật chữ Status và Button Start theo ngôn ngữ
            updateTimerDisplay();

            // Đổi giao diện tab
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            let activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.add('active');
            
            // Đổi màu số đếm
            const timerDisplay = document.getElementById('timer');
            if (mode === 'pomodoro') timerDisplay.style.color = '#ff416c'; 
            else if (mode === 'short') timerDisplay.style.color = '#0072ff'; 
            else timerDisplay.style.color = '#11998e'; 
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            const langData = i18n[currentLang];

            if (timerState === 'idle' || timerState === 'paused') {
                // Play
                timerState = 'running';
                startBtn.textContent = langData.btnPause;
                startBtn.style.background = "linear-gradient(45deg, #e65c00, #f9d423)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(230, 92, 0, 0.4)";
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        updateTimerDisplay(); 
                    } else { 
                        clearInterval(timerId); 
                        timerId = null;
                        timerState = 'idle';
                        startBtn.textContent = langData.btnStart;
                        startBtn.style.background = "linear-gradient(45deg, #ff4e50, #f9d423)";
                        startBtn.style.boxShadow = "0 6px 20px rgba(255, 78, 80, 0.4)";
                        alert(langData.alertDone); 
                    }
                }, 1000);
            } else {
                // Pause
                clearInterval(timerId);
                timerState = 'paused';
                startBtn.textContent = langData.btnResume;
                startBtn.style.background = "linear-gradient(45deg, #8a2387, #e94057, #f27121)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(233, 64, 87, 0.4)";
            }
        }
    </script>
</body>
</html>

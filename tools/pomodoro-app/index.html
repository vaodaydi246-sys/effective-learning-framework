<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flocus Minimal Pomodoro</title>
    <style>
        /* --- ĐỊNH DẠNG CHUNG --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1e1e1e url('https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920') no-repeat center center/cover;
            color: white;
            overflow: hidden;
            transition: background-image 0.5s ease;
        }

        /* Lớp phủ tối mờ để số luôn nổi bật */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* --- BỘ ĐẾM GIỜ TRUNG TÂM --- */
        .main-timer-container {
            position: relative;
            z-index: 2;
            text-align: center;
            /* Cố định kích thước để khi ẩn chữ, con số không bị giật lên xuống */
            height: 300px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Vùng chứa các tab chuyển chế độ */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            transition: opacity 0.4s ease;
        }
        .mode-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 5px 0;
            transition: all 0.3s ease;
            position: relative;
        }
        .mode-btn:hover, .mode-btn.active { color: #fff; }
        .mode-btn.active::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
            background: white; border-radius: 2px;
        }

        /* Con số thời gian khổng lồ */
        .time-display {
            font-size: 140px;
            font-weight: 700;
            line-height: 1;
            margin: 10px 0 30px 0;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* Vùng chứa nút Start/Pause */
        .action-wrapper {
            height: 50px;
            transition: opacity 0.4s ease;
        }
        .action-btn {
            background: white;
            color: black;
            border: none;
            padding: 12px 45px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .action-btn:hover { transform: scale(1.05); }

        /* =========================================
           HIỆU ỨNG KHI BẮT ĐẦU ĐẾM GIỜ (FOCUS MODE)
           ========================================= */
        /* Ẩn TOÀN BỘ chữ (Tab chế độ và Nút Start/Pause) */
        .main-timer-container.focus-mode .mode-switcher,
        .main-timer-container.focus-mode .action-wrapper {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Riêng nút PAUSE: Sẽ HIỆN LẠI mờ mờ khi bạn DI CHUỘT vào vùng đếm giờ */
        .main-timer-container.focus-mode:hover .action-wrapper {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- NÚT BÁNH RĂNG VÀ SIDEBAR CÀI ĐẶT --- */
        .settings-toggle-btn {
            position: absolute;
            top: 30px; right: 30px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; font-size: 20px;
            width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); transition: background 0.3s ease;
        }
        .settings-toggle-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .sidebar-settings {
            position: fixed;
            top: 0; right: -350px; width: 320px; height: 100vh;
            background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(20px);
            box-shadow: -5px 0 30px rgba(0,0,0,0.5); z-index: 100;
            padding: 30px; box-sizing: border-box;
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        .sidebar-settings.open { right: 0; }

        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }
        .sidebar-header h3 { margin: 0; font-size: 20px; }
        .close-sidebar-btn { background: none; border: none; color: #aaa; font-size: 28px; cursor: pointer; }
        .close-sidebar-btn:hover { color: white; }

        .setting-group { margin-bottom: 20px; }
        .setting-group label {
            display: block; font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
        }
        .setting-group input[type="number"], .setting-group select {
            width: 100%; padding: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box;
        }
        .setting-group input:focus, .setting-group select:focus { outline: none; border-color: rgba(255,255,255,0.4); }

        .save-sidebar-btn {
            width: 100%; padding: 12px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
            color: white; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: background 0.3s;
        }
        .save-sidebar-btn:hover { background: white; color: black; }
        option { background: #333; color: white; }
    </style>
</head>
<body>

    <!-- Nút Cài Đặt (Góc phải) -->
    <button class="settings-toggle-btn" id="openSettingsBtn">⚙️</button>

    <!-- Sidebar Cài Đặt -->
    <div class="sidebar-settings" id="sidebarSettings">
        <div class="sidebar-header">
            <h3 id="txt-title">Settings</h3>
            <button class="close-sidebar-btn" id="closeSettingsBtn">&times;</button>
        </div>

        <!-- Chọn ngôn ngữ -->
        <div class="setting-group">
            <label id="txt-lang-label">Language</label>
            <select id="select-lang" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="vi">Tiếng Việt</option>
            </select>
        </div>

        <!-- Chỉnh thời gian -->
        <div class="setting-group">
            <label id="txt-pomo-label">Focus Time (Min)</label>
            <input type="number" id="input-pomo" value="25" min="1">
        </div>
        <div class="setting-group">
            <label id="txt-short-label">Short Break (Min)</label>
            <input type="number" id="input-short" value="5" min="1">
        </div>
        <div class="setting-group">
            <label id="txt-long-label">Long Break (Min)</label>
            <input type="number" id="input-long" value="15" min="1">
        </div>

        <!-- Chọn Hình Nền (Đã thêm nhiều ảnh đẹp) -->
        <div class="setting-group">
            <label id="txt-bg-label">Background Space</label>
            <select id="select-bg">
                <option value="https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920">🏔️ Swiss Alps</option>
                <option value="https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?q=80&w=1920">🪵 Cozy Desk</option>
                <option value="https://images.unsplash.com/photo-1431274151480-1a111107ec45?q=80&w=1920">🗼 Paris Dreams</option>
                <option value="https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?q=80&w=1920">🌧️ Rainy Window</option>
                <option value="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=1920">🌌 Deep Space</option>
                <option value="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=1920">☕ Lo-fi Cafe</option>
                <option value="https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1920">🌲 Dark Forest</option>
                <option value="https://images.unsplash.com/photo-1477959858617-6c9224f21afb?q=80&w=1920">🌃 City Night</option>
            </select>
        </div>

        <button class="save-sidebar-btn" id="btn-save" onclick="saveSettings()">APPLY SETTINGS</button>
    </div>

    <!-- KHUNG ĐẾM GIỜ CHÍNH -->
    <div class="main-timer-container" id="timerContainer">
        
        <!-- Các chế độ (Sẽ bị ẩn nhờ CSS khi start) -->
        <div class="mode-switcher" id="modeSwitcher">
            <button class="mode-btn active" id="btn-pomo" onclick="changeMode('pomo')">Pomodoro</button>
            <button class="mode-btn" id="btn-short" onclick="changeMode('short')">Short Break</button>
            <button class="mode-btn" id="btn-long" onclick="changeMode('long')">Long Break</button>
        </div>

        <!-- Con số đếm ngược -->
        <div class="time-display" id="timeDisplay">25:00</div>

        <!-- Vùng chứa Nút bấm (Sẽ bị ẩn khi start, di chuột mới hiện) -->
        <div class="action-wrapper">
            <button class="action-btn" id="actionBtn" onclick="toggleTimer()">START</button>
        </div>
    </div>

    <script>
        // QUẢN LÝ NGÔN NGỮ (Mặc định Tiếng Anh)
        const langData = {
            en: {
                title: "Settings", langLabel: "Language",
                pomoLabel: "Focus Time (Min)", shortLabel: "Short Break (Min)", longLabel: "Long Break (Min)",
                bgLabel: "Background Space", save: "APPLY SETTINGS",
                btnPomo: "Pomodoro", btnShort: "Short Break", btnLong: "Long Break",
                start: "START", pause: "PAUSE"
            },
            vi: {
                title: "Cài đặt", langLabel: "Ngôn ngữ",
                pomoLabel: "Thời gian học (Phút)", shortLabel: "Nghỉ ngắn (Phút)", longLabel: "Nghỉ dài (Phút)",
                bgLabel: "Hình nền", save: "ÁP DỤNG CÀI ĐẶT",
                btnPomo: "Pomodoro", btnShort: "Nghỉ ngắn", btnLong: "Nghỉ dài",
                start: "BẮT ĐẦU", pause: "TẠM DỪNG"
            }
        };

        let currentLang = 'en';

        function changeLanguage() {
            currentLang = document.getElementById('select-lang').value;
            const data = langData[currentLang];

            // Đổi chữ Sidebar
            document.getElementById('txt-title').textContent = data.title;
            document.getElementById('txt-lang-label').textContent = data.langLabel;
            document.getElementById('txt-pomo-label').textContent = data.pomoLabel;
            document.getElementById('txt-short-label').textContent = data.shortLabel;
            document.getElementById('txt-long-label').textContent = data.longLabel;
            document.getElementById('txt-bg-label').textContent = data.bgLabel;
            document.getElementById('btn-save').textContent = data.save;

            // Đổi chữ Màn hình chính
            document.getElementById('btn-pomo').textContent = data.btnPomo;
            document.getElementById('btn-short').textContent = data.btnShort;
            document.getElementById('btn-long').textContent = data.btnLong;
            
            if(!timerRunning) {
                document.getElementById('actionBtn').textContent = data.start;
            } else {
                document.getElementById('actionBtn').textContent = data.pause;
            }
        }

        // QUẢN LÝ THỜI GIAN
        let configTimes = { pomo: 25, short: 5, long: 15 };
        let activeMode = 'pomo';
        let timeLeft = configTimes.pomo * 60;
        let countdownInterval = null;
        let timerRunning = false;

        // Xử lý Sidebar và Nền
        const sidebar = document.getElementById('sidebarSettings');
        document.getElementById('openSettingsBtn').addEventListener('click', () => sidebar.classList.add('open'));
        document.getElementById('closeSettingsBtn').addEventListener('click', () => sidebar.classList.remove('open'));

        document.getElementById('select-bg').addEventListener('change', function() {
            document.body.style.backgroundImage = `url('${this.value}')`;
        });

        function saveSettings() {
            configTimes.pomo = parseInt(document.getElementById('input-pomo').value) || 25;
            configTimes.short = parseInt(document.getElementById('input-short').value) || 5;
            configTimes.long = parseInt(document.getElementById('input-long').value) || 15;
            sidebar.classList.remove('open'); 
            resetCurrentTimer();
        }

        function changeMode(mode) {
            if (timerRunning) return; 
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            resetCurrentTimer();
        }

        function resetCurrentTimer() {
            clearInterval(countdownInterval);
            countdownInterval = null;
            timerRunning = false;
            timeLeft = configTimes[activeMode] * 60;
            updateDisplay();
            
            document.getElementById('actionBtn').textContent = langData[currentLang].start;
            
            // Tắt Focus Mode -> HIỆN LẠI TẤT CẢ CHỮ
            document.getElementById('timerContainer').classList.remove('focus-mode');
            document.getElementById('openSettingsBtn').style.display = 'flex';
        }

        function updateDisplay() {
            let minutes = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let seconds = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').textContent = `${minutes}:${seconds}`;
        }

        function toggleTimer() {
            const actionBtn = document.getElementById('actionBtn');
            const timerContainer = document.getElementById('timerContainer');

            if (!timerRunning) {
                // KHI BẮT ĐẦU CHẠY
                timerRunning = true;
                actionBtn.textContent = langData[currentLang].pause;
                
                // Ẩn nút Cài đặt bánh răng góc phải
                document.getElementById('openSettingsBtn').style.display = 'none';
                sidebar.classList.remove('open');
                
                // BẬT FOCUS MODE -> CSS SẼ TỰ ĐỘNG LÀM MỜ BIẾN MẤT CÁC CHỮ VÀ NÚT BẤM
                timerContainer.classList.add('focus-mode');

                countdownInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        // Tự động chuyển mode hoặc báo hết giờ
                        alert("Time's up!");
                        resetCurrentTimer();
                    }
                }, 1000);
            } else {
                // BẤM TẠM DỪNG -> Trở về bình thường
                resetCurrentTimer();
            }
        }
    </script>
</body>
</html>

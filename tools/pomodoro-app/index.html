<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effective Learning - Advanced Pomodoro Timer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .timer-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; }
        .status-text { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Cụm nút chọn chế độ thời gian */
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 8px; }
        .mode-btn { background-color: #e0e0e0; border: none; padding: 8px 12px; font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer; color: #555; transition: all 0.2s; flex: 1; }
        .mode-btn.active { background-color: #e74c3c; color: white; }
        
        .time { font-size: 64px; font-weight: bold; color: #2c3e50; margin: 20px 0; font-variant-numeric: tabular-nums; }
        
        /* Nút Start/Pause */
        .btn-main { background-color: #2ecc71; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 25px; cursor: pointer; transition: background 0.2s; width: 100%; font-weight: bold; }
        .btn-main:hover { background-color: #27ae60; }
    </style>
</head>
<body>
    <div class="timer-card">
        <h1>🎯 ELF Pomodoro Timer</h1>
        <div class="status-text" id="status">Sẵn sàng học tập</div>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-pomodoro" onclick="setMode('pomodoro', 25, 'Sẵn sàng học tập')">25m Pomodoro</button>
            <button class="mode-btn" id="btn-short" onclick="setMode('short', 5, 'Giờ nghỉ giải lao')">5m Break</button>
            <button class="mode-btn" id="btn-long" onclick="setMode('long', 15, 'Nghỉ ngơi thư giãn')">15m Long Break</button>
        </div>

        <div class="time" id="timer">25:00</div>
        <button class="btn-main" id="startBtn" onclick="toggleTimer()">Bắt Đầu</button>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let currentMode = 'pomodoro';

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Hàm xử lý khi bấm chuyển đổi qua lại giữa các nút thời gian
        function setMode(mode, minutes, statusText) {
            // Dừng đồng hồ lại nếu đang chạy
            if (timerId !== null) {
                toggleTimer();
            }
            
            currentMode = mode;
            timeLeft = minutes * 60;
            document.getElementById('status').textContent = statusText;
            updateTimerDisplay();

            // Đổi màu nút được chọn
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            // Đổi màu chữ số theo chế độ (Đỏ cho Pomodoro, Xanh cho giờ nghỉ)
            if (mode === 'pomodoro') {
                document.getElementById('btn-pomodoro').style.backgroundColor = '#e74c3c';
                document.getElementById('timer').style.color = '#2c3e50';
            } else {
                document.getElementById('timer').style.color = '#2ecc71';
            }
        }

        function toggleTimer() {
            if (timerId === null) {
                document.getElementById('startBtn').textContent = "Tạm Dừng";
                document.getElementById('startBtn').style.backgroundColor = "#e67e22";
                timerId = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        updateTimerDisplay(); 
                    } else { 
                        clearInterval(timerId); 
                        timerId = null;
                        alert("Hết thời gian! Hãy chọn chế độ tiếp theo."); 
                        resetControls();
                    }
                }, 1000);
            } else {
                clearInterval(timerId);
                timerId = null;
                resetControls();
            }
        }

        function resetControls() {
            document.getElementById('startBtn').textContent = "Bắt Đầu";
            document.getElementById('startBtn').style.backgroundColor = "#2ecc71";
        }
    </script>
</body>
</html>

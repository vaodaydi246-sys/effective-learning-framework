<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pomodoro</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #2c3e50 url('https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920') no-repeat center center/cover;
            transition: background-image 0.5s ease;
            overflow: hidden;
        }

        /* --- NÚT 3 GẠCH GÓC TRÊN PHẢI --- */
        .menu-hamburger {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            font-size: 24px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* MENU THẢ XUỐNG */
        .dropdown-menu {
            position: absolute;
            top: 75px;
            right: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 99;
            display: none;
            width: 200px;
        }
        .dropdown-menu select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* --- KHUNG ĐẾM GIỜ CHÍNH --- */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            width: 340px;
            transition: all 0.4s ease;
        }

        /* Khi bấm START: Xóa hết nền trắng, đẩy vào giữa và MỜ ĐI */
        .container.running-mode {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            opacity: 0.3; /* Màu chữ và nút mờ hẳn đi */
        }
        .container.running-mode:hover {
            opacity: 1; /* Di chuột vào giữa màn hình sẽ rõ lại để bấm Tạm dừng */
        }

        /* Thiết lập màu chữ thời gian NHẠT VÀ DỊU */
        .time-display {
            font-size: 75px;
            font-weight: 700;
            color: #a8a8a8; /* Màu xám nhạt lo-fi không mỏi mắt */
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
        }

        /* --- CÀI ĐẶT THỜI GIAN TRỰC TIẾP --- */
        .config-section {
            margin: 15px 0;
            padding: 10px;
            background: rgba(0,0,0,0.03);
            border-radius: 10px;
        }
        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }
        .input-row input {
            width: 50px;
            padding: 4px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Các nút bấm */
        .tab-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 8px 0; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 12px;}
        .tab-btn.active { background: #74b9ff; color: white; }

        .btn-start {
            width: 100%;
            padding: 14px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Nút 3 gạch ở góc phải -->
    <button class="menu-hamburger" id="menuBtn">☰</button>
    
    <!-- Menu thả xuống chứa Hình nền -->
    <div class="dropdown-menu" id="dropdownMenu">
        <label style="font-size: 12px; font-weight: bold; color: #666;">CHỌN HÌNH NỀN</label>
        <select id="bgSelect">
            <option value="https://images.unsplash.com/photo-1530122037265-a5f1f91d3b99?q=80&w=1920">🏔️ Thụy Sĩ</option>
            <option value="https://images.unsplash.com/photo-1431274151480-1a111107ec45?q=80&w=1920">🗼 Paris</option>
            <option value="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1920">⛩️ Kyoto</option>
            <option value="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTOmmZhAjkxSAZLsJi1_y5P4jAIurrHRuJdnYQpJlIy6LFXh6u2qR0EN_HnRuOI6dwLW5N01bP1dPDa-q4">📖 Anime Room</option>
        </select>
    </div>

    <!-- Khung giao diện chính -->
    <div class="container" id="mainContainer">
        
        <!-- Vùng menu chỉnh thời gian (Sẽ bị xóa hoàn toàn khi bấm Start) -->
        <div id="setupArea">
            <h2 style="margin: 0 0 15px 0; color: #333; font-size: 20px;">Pomodoro Focus</h2>
            
            <div class="tab-buttons">
                <button class="tab-btn active" id="tab-pomo" onclick="switchMode('pomo')">Học tập</button>
                <button class="tab-btn" id="tab-short" onclick="switchMode('short')">Nghỉ ngắn</button>
                <button class="tab-btn" id="tab-long" onclick="switchMode('long')">Nghỉ dài</button>
            </div>

            <div class="config-section">
                <div class="input-row">
                    <label>Thời gian học (phút):</label>
                    <input type="number" id="cfg-pomo" value="25" min="1">
                </div>
                <div class="input-row">
                    <label>Nghỉ ngắn (phút):</label>
                    <input type="number" id="cfg-short" value="5" min="1">
                </div>
                <div class="input-row">
                    <label>Nghỉ dài (phút):</label>
                    <input type="number" id="cfg-long" value="15" min="1">
                </div>
                <button onclick="applyCustomTimes()" style="width:100%; padding:5px; margin-top:5px; cursor:pointer; font-weight:bold; background:#fff; border:1px solid #ccc; border-radius:4px;">Cập nhật số phút</button>
            </div>
        </div>

        <!-- Khung hiển thị thời gian và nút bấm chính -->
        <div id="timerArea">
            <div class="time-display" id="timeText">25:00</div>
            <button class="btn-start" id="startBtn" onclick="triggerTimer()">BẮT ĐẦU</button>
        </div>

    </div>

    <script>
        // Quản lý trạng thái
        let durations = { pomo: 25, short: 5, long: 15 };
        let currentMode = 'pomo';
        let timeLeft = durations.pomo * 60;
        let timerInterval = null;
        let isRunning = false;

        // 1. Đóng/Mở Menu 3 gạch
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
        });

        document.addEventListener('click', () => {
            dropdownMenu.style.display = 'none';
        });

        // Đổi hình nền
        document.getElementById('bgSelect').addEventListener('change', function() {
            document.body.style.backgroundImage = `url('${this.value}')`;
        });

        // 2. Chỉnh mức thời gian trực tiếp
        function applyCustomTimes() {
            durations.pomo = parseInt(document.getElementById('cfg-pomo').value) || 25;
            durations.short = parseInt(document.getElementById('cfg-short').value) || 5;
            durations.long = parseInt(document.getElementById('cfg-long').value) || 15;
            
            alert("Đã cập nhật thời gian thành công!");
            resetTimer();
        }

        function switchMode(mode) {
            if (isRunning) return;
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(mode === 'pomo') document.getElementById('tab-pomo').classList.add('active');
            if(mode === 'short') document.getElementById('tab-short').classList.add('active');
            if(mode === 'long') document.getElementById('tab-long').classList.add('active');
            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            timeLeft = durations[currentMode] * 60;
            renderDisplay();
            
            // Hiện lại toàn bộ menu cài đặt
            document.getElementById('setupArea').style.display = 'block';
            menuBtn.style.display = 'block';
            document.getElementById('mainContainer').classList.remove('running-mode');
            document.getElementById('startBtn').textContent = 'BẮT ĐẦU';
        }

        function renderDisplay() {
            let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            let secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timeText').textContent = `${mins}:${secs}`;
        }

        // 3. Khi ấn START/PAUSE
        function triggerTimer() {
            const container = document.getElementById('mainContainer');
            const setupArea = document.getElementById('setupArea');
            const startBtn = document.getElementById('startBtn');

            if (!isRunning) {
                // TRẠNG THÁI CHẠY ĐẾM GIỜ
                isRunning = true;
                
                // Giấu sạch menu cài đặt & nút 3 gạch
                setupArea.style.display = 'none';
                menuBtn.style.display = 'none';
                dropdownMenu.style.display = 'none';
                
                // Biến mất nền trắng, chuyển khung số ra giữa và làm mờ đi
                container.classList.add('running-mode');
                startBtn.textContent = 'TẠM DỪNG';

                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        renderDisplay();
                    } else {
                        alert("Hết giờ rồi!");
                        resetTimer();
                    }
                }, 1000);
            } else {
                // TRẠNG THÁI BẤM TẠM DỪNG -> HIỆN LẠI MENU
                resetTimer();
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effective Learning - Advanced Pomodoro - Colorful Edition</title>
    <style>
        /* Nền dải màu gradient chuyển động rực rỡ */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(-45deg, #ff416c, #ff4b2b, #11998e, #38ef7d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Thẻ chứa được thiết kế dạng kính (Glassmorphism) cực kỳ bắt mắt */
        .timer-card { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), 0 0 30px rgba(255,255,255,0.5) inset; 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Đổi màu chữ tiêu đề thành gradient neon */
        h1 { 
            background: linear-gradient(45deg, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px; 
            margin-bottom: 5px; 
            font-weight: 800;
        }

        .status-text { 
            color: #ff6b6b; 
            font-size: 14px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }
        
        /* Cụm nút chọn chế độ đầy màu sắc */
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 10px; }
        
        .mode-btn { 
            background-color: #f0f0f0; 
            border: 2px solid transparent; 
            padding: 12px 10px; 
            font-size: 13px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #666; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            flex: 1; 
        }
        
        .mode-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Màu sắc rực rỡ riêng biệt cho từng nút khi được kích hoạt */
        .mode-btn.active#btn-pomodoro { 
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(255, 8, 68, 0.4);
        } 
        
        .mode-btn.active#btn-short { 
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4);
        }

        .mode-btn.active#btn-long { 
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); 
            color: white;
            box-shadow: 0 5px 15px rgba(245, 175, 25, 0.4);
        }
        
        /* Số đồng hồ siêu to khổng lồ và sắc nét */
        .time { 
            font-size: 80px; 
            font-weight: 900; 
            color: #ff0844; /* Đỏ rực rỡ mặc định */
            margin: 15px 0 30px 0; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 2px 4px 10px rgba(0,0,0,0.15);
            transition: color 0.4s ease;
        }
        
        /* Nút Điều khiển chính với hiệu ứng đổi màu sặc sỡ */
        .btn-main { 
            background: linear-gradient(45deg, #11998e, #38ef7d); /* Xanh lá rực rỡ ban đầu */
            color: white; 
            border: none; 
            padding: 18px 30px; 
            font-size: 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        
        .btn-main:hover { 
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.6);
        }

        .btn-main:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="timer-card">
        <h1>🎯 ELF Pomodoro</h1>
        <div class="status-text" id="status">SẴN SÀNG HỌC TẬP</div>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-pomodoro" onclick="setMode('pomodoro', 25, 'Sẵn sàng học tập')">25m Học</button>
            <button class="mode-btn" id="btn-short" onclick="setMode('short', 5, 'Nghỉ giải lao ngắn')">5m Nghỉ</button>
            <button class="mode-btn" id="btn-long" onclick="setMode('long', 15, 'Nghỉ ngơi dài')">15m Nghỉ</button>
        </div>

        <div class="time" id="timer">25:00</div>
        <button class="btn-main" id="startBtn" onclick="toggleTimer()">BẮT ĐẦU</button>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setMode(mode, minutes, statusText) {
            clearInterval(timerId);
            timerId = null;
            
            // Reset nút chính về trạng thái BẮT ĐẦU sặc sỡ ban đầu
            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = "BẮT ĐẦU";
            startBtn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
            startBtn.style.boxShadow = "0 6px 20px rgba(56, 239, 125, 0.4)";

            timeLeft = minutes * 60;
            document.getElementById('status').textContent = statusText;
            updateTimerDisplay();

            // Loại bỏ class active của tất cả các nút
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Kích hoạt nút tương ứng
            let activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.add('active');
            
            // Thay đổi màu sắc của chữ số đồng hồ linh hoạt theo từng chế độ
            const timerDisplay = document.getElementById('timer');
            if (mode === 'pomodoro') {
                timerDisplay.style.color = '#ff0844'; // Đỏ neon cho lúc học
            } else if (mode === 'short') {
                timerDisplay.style.color = '#0072ff'; // Xanh dương tươi mát cho nghỉ ngắn
            } else {
                timerDisplay.style.color = '#f12711'; // Cam cháy năng lượng cho nghỉ dài
            }
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            if (timerId === null) {
                // Đang dừng -> Bấm để Chạy (Đổi sang màu Cam Sunset rực rỡ)
                startBtn.textContent = "TẠM DỪNG";
                startBtn.style.background = "linear-gradient(45deg, #f12711, #f5af19)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(245, 175, 25, 0.4)";
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        updateTimerDisplay(); 
                    } else { 
                        clearInterval(timerId); 
                        timerId = null;
                        startBtn.textContent = "BẮT ĐẦU";
                        startBtn.style.background = "linear-gradient(45deg, #11998e, #38ef7d)";
                        startBtn.style.boxShadow = "0 6px 20px rgba(56, 239, 125, 0.4)";
                        alert("⏳ Đã hết thời gian! Chuyển sang bước tiếp theo nào."); 
                    }
                }, 1000);
            } else {
                // Đang chạy -> Bấm để Tạm dừng (Đổi sang màu Xanh lơ / Tím mộng mơ)
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = "TIẾP TỤC";
                startBtn.style.background = "linear-gradient(45deg, #8a2387, #e94057, #f27121)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(233, 64, 87, 0.4)";
            }
        }
    </script>
</body>
</html>

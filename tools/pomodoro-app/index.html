<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Pomodoro - Japan Anime Chill Edition</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1.2s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        /* Lớp phủ mờ giúp hình nền dịu lại, nổi bật thẻ đếm giờ phía trước */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* --- MENU CHỌN PHONG CẢNH NHẬT BẢN --- */
        .bg-selector-container {
            position: absolute;
            top: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .bg-selector-container span {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
        }
        .bg-select {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }
        .bg-select:hover {
            background: #f1f3f5;
            border-color: #ced4da;
        }

        /* Thẻ chứa Pomodoro siêu mờ ảo phong cách Frosted Glass */
        .timer-card { 
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.75); 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 24px 64px rgba(0,0,0,0.3), 0 0 40px rgba(255,255,255,0.4) inset; 
            text-align: center; 
            max-width: 380px; 
            width: 100%; 
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .timer-card:hover {
            transform: translateY(-4px);
        }

        h1 { 
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px; 
            margin-top: 0;
            margin-bottom: 5px; 
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .status-text { 
            color: #e74c3c; 
            font-size: 12px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold;
        }
        
        .mode-container { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 8px; }
        
        .mode-btn { 
            background-color: rgba(0,0,0,0.06); 
            border: none; 
            padding: 12px 8px; 
            font-size: 12px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            color: #4a4a4a; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            flex: 1; 
        }
        
        .mode-btn:hover { 
            transform: translateY(-2px);
            background-color: rgba(0,0,0,0.1);
        }

        /* Active Modes Gradient rực rỡ */
        .mode-btn.active#btn-pomodoro { 
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); 
            color: white;
            box-shadow: 0 6px 14px rgba(255, 65, 108, 0.35);
        } 
        
        .mode-btn.active#btn-short { 
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); 
            color: white;
            box-shadow: 0 6px 14px rgba(0, 114, 255, 0.35);
        }

        .mode-btn.active#btn-long { 
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); 
            color: white;
            box-shadow: 0 6px 14px rgba(56, 239, 125, 0.35);
        }
        
        .time { 
            font-size: 80px; 
            font-weight: 900; 
            color: #ff416c; 
            margin: 10px 0 25px 0; 
            font-variant-numeric: tabular-nums; 
            text-shadow: 2px 4px 12px rgba(0,0,0,0.12);
            transition: color 0.4s ease;
        }
        
        .btn-main { 
            background: linear-gradient(45deg, #ff4e50, #f9d423); 
            color: white; 
            border: none; 
            padding: 16px 30px; 
            font-size: 18px; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%; 
            font-weight: bold; 
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(255, 78, 80, 0.4);
        }
        
        .btn-main:hover { 
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 78, 80, 0.55);
        }
        .btn-main:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Menu chọn hình nền phong cảnh Anime Nhật Bản -->
    <div class="bg-selector-container">
        <span>🇯🇵 Nền Anime:</span>
        <select class="bg-select" id="bgSelect" onchange="changeBackground()">
            <option value="sakura">🌸 Con đường Hoa Anh Đào</option>
            <option value="train">🚋 Cửa sổ Tàu Hoàng Hôn</option>
            <option value="shrine">⛩️ Cổng trời Đền Thần Thoại</option>
            <option value="room">📖 Phòng học Anime Gác Mái</option>
        </select>
    </div>

    <div class="timer-card">
        <h1>🎯 ELF Pomodoro</h1>
        <div class="status-text" id="status">SẴN SÀNG HỌC TẬP</div>
        
        <div class="mode-container">
            <button class="mode-btn active" id="btn-pomodoro" onclick="setMode('pomodoro', 25, 'Sẵn sàng học tập')">25m Học</button>
            <button class="mode-btn" id="btn-short" onclick="setMode('short', 5, 'Nghỉ giải lao ngắn')">5m Nghỉ</button>
            <button class="mode-btn" id="btn-long" onclick="setMode('long', 15, 'Nghỉ ngơi dài')">15m Nghỉ</button>
        </div>

        <div class="time" id="timer">25:00</div>
        <button class="btn-main" id="startBtn" onclick="toggleTimer()">BẮT ĐẦU</button>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;

        // Bộ ảnh nền phong cảnh Nhật Bản / Anime độ phân giải cao
        const backgrounds = {
            sakura: "url('https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcR-C8lw7rE4jYlRdajEfSgUtxFri2q5x-PN6TQAUQNWfGTVdra-GLoVE57FHigqcmnFyohHLekFuRrFg1Q')",
            train: "url('https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcR1a-khtf63S5ym_iHfi6XPnkhFoa6rhPApI0-wvInUKcfOCFqSDrmAImnjuBXHIylXjRKwB-_Ptzowtag')",
            shrine: "url('https://encrypted-tbn1.gstatic.com/licensed-image?q=tbn:ANd9GcQNaJ-zw-UlYAp-A_eeyAkna1ZzrHzGfGU7WCTSVVl3i8wSQvMJMPkkbLyNpnWg-gUW1aT1rN7l1-fYeV0')",
            room: "url('https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTOmmZhAjkxSAZLsJi1_y5P4jAIurrHRuJdnYQpJlIy6LFXh6u2qR0EN_HnRuOI6dwLW5N01bP1dPDa-q4')"
        };

        function changeBackground() {
            const selectedKey = document.getElementById('bgSelect').value;
            document.body.style.backgroundImage = backgrounds[selectedKey];
        }

        // Tự động tải hình nền đầu tiên khi mở trang
        window.onload = function() {
            changeBackground();
        };

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function setMode(mode, minutes, statusText) {
            clearInterval(timerId);
            timerId = null;
            
            const startBtn = document.getElementById('startBtn');
            startBtn.textContent = "BẮT ĐẦU";
            startBtn.style.background = "linear-gradient(45deg, #ff4e50, #f9d423)";
            startBtn.style.boxShadow = "0 6px 20px rgba(255, 78, 80, 0.4)";

            timeLeft = minutes * 60;
            document.getElementById('status').textContent = statusText;
            updateTimerDisplay();

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            let activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.classList.add('active');
            
            const timerDisplay = document.getElementById('timer');
            if (mode === 'pomodoro') {
                timerDisplay.style.color = '#ff416c'; 
            } else if (mode === 'short') {
                timerDisplay.style.color = '#0072ff'; 
            } else {
                timerDisplay.style.color = '#11998e'; 
            }
        }

        function toggleTimer() {
            const startBtn = document.getElementById('startBtn');
            if (timerId === null) {
                // Khi đang chạy -> Chuyển nút sang màu cam tím lofi hoàng hôn
                startBtn.textContent = "TẠM DỪNG";
                startBtn.style.background = "linear-gradient(45deg, #e65c00, #f9d423)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(230, 92, 0, 0.4)";
                
                timerId = setInterval(() => {
                    if (timeLeft > 0) { 
                        timeLeft--; 
                        updateTimerDisplay(); 
                    } else { 
                        clearInterval(timerId); 
                        timerId = null;
                        startBtn.textContent = "BẮT ĐẦU";
                        startBtn.style.background = "linear-gradient(45deg, #ff4e50, #f9d423)";
                        startBtn.style.boxShadow = "0 6px 20px rgba(255, 78, 80, 0.4)";
                        alert("⏳ Đã hết thời gian! Chuyển sang bước tiếp theo nào."); 
                    }
                }, 1000);
            } else {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = "TIẾP TỤC";
                startBtn.style.background = "linear-gradient(45deg, #8a2387, #e94057, #f27121)"; 
                startBtn.style.boxShadow = "0 6px 20px rgba(233, 64, 87, 0.4)";
            }
        }
    </script>
</body>
</html>
